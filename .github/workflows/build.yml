name: Build PhoneBridge (Android & iOS)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # امکان اجرای دستی در هر لحظه از پنل گیت‌هاب

jobs:
  # ---------------------------------------------
  # ۱. ساخت خروجی APK برای گوشی سامسونگ اندروید
  # ---------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Debug APK
        working-directory: phone-bridge/android-gateway
        run: |
          gradle wrapper
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneBridge-Android-APK
          path: phone-bridge/android-gateway/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # ---------------------------------------------
  # ۲. ساخت خروجی IPA برای آیفون ۱۷
  # ---------------------------------------------
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: phone-bridge/ios-client/PhoneBridge
        run: xcodegen generate

      - name: Build iOS Application (Unsigned IPA)
        working-directory: phone-bridge/ios-client/PhoneBridge
        run: |
          xcodebuild clean build \
            -project PhoneBridge.xcodeproj \
            -scheme PhoneBridge \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          # بسته‌بندی فایل به فرمت استاندارد IPA برای Sideloadly
          mkdir -p build/Payload
          cp -r build/derivedData/Build/Products/Release-iphoneos/PhoneBridge.app build/Payload/
          cd build && zip -r ../PhoneBridge.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneBridge-iOS-IPA
          path: phone-bridge/ios-client/PhoneBridge/PhoneBridge.ipa
          retention-days: 7
