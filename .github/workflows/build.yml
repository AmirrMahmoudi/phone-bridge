name: Build PhoneBridge (Android & iOS)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ---------------------------------------------
  # 1. Build Android APK
  # ---------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        working-directory: android-gateway
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: android-gateway
        run: |
          ./gradlew clean assembleDebug --stacktrace --info
          
      - name: Collect APK
        run: |
          mkdir -p android-apk
          find android-gateway/app/build/outputs/apk -name "*.apk" -exec cp {} android-apk/ \;
          ls -la android-apk/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneBridge-Android-APK
          path: android-apk/
          retention-days: 7

  # ---------------------------------------------
  # 2. Build iOS IPA (with CocoaPods)
  # ---------------------------------------------
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version

      - name: Install Pod Dependencies
        working-directory: ios-client
        run: |
          pod install --repo-update

      - name: Build iOS Application (Unsigned)
        working-directory: ios-client
        run: |
          set -o pipefail
          xcodebuild clean archive \
            -workspace PhoneBridge.xcworkspace \
            -scheme PhoneBridge \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/PhoneBridge.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee /tmp/ios_build.log || {
            echo "::group::iOS Build Failure Log"
            tail -n 100 /tmp/ios_build.log
            echo "::endgroup::"
            echo "::error::iOS build failed - check logs above"
            exit 1
          }

      - name: Create IPA Package
        working-directory: ios-client
        run: |
          APP_DIR="build/PhoneBridge.xcarchive/Products/Applications/PhoneBridge.app"
          
          # Verify app exists
          if [ ! -d "$APP_DIR" ]; then
            echo "::error::App bundle not found at $APP_DIR"
            exit 1
          fi
          
          # Verify critical keys in Info.plist
          echo "=== Verifying Info.plist ==="
          plutil -p "$APP_DIR/Info.plist" || true
          
          # Package as IPA
          mkdir -p build/Payload
          cp -r "$APP_DIR" build/Payload/
          cd build && zip -qr ../PhoneBridge.ipa Payload
          cd ..
          
          # Verify IPA created
          if [ -f "PhoneBridge.ipa" ]; then
            ls -lh PhoneBridge.ipa
            echo "✅ IPA created successfully"
          else
            echo "::error::Failed to create IPA"
            exit 1
          fi

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneBridge-iOS-IPA
          path: ios-client/PhoneBridge.ipa
          retention-days: 7

  # ---------------------------------------------
  # 3. Summary Job (Optional)
  # ---------------------------------------------
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: always()
    steps:
      - name: Check Build Results
        run: |
          echo "## PhoneBridge Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.build-android.result }}" == "success" ]; then
            echo "| Android  | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Android  | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.build-ios.result }}" == "success" ]; then
            echo "| iOS      | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| iOS      | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Android APK: Available for 7 days" >> $GITHUB_STEP_SUMMARY
          echo "- iOS IPA: Available for 7 days" >> $GITHUB_STEP_SUMMARY
          
