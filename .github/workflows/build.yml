name: Build PhoneBridge (Android & iOS)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ---------------------------------------------
  # ۱. ساخت خروجی APK برای گوشی سامسونگ اندروید
  # ---------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android Debug APK
        working-directory: android-gateway
        run: |
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneBridge-Android-APK
          path: android-gateway/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # ---------------------------------------------
  # ۲. ساخت خروجی IPA برای آیفون ۱۷
  # ---------------------------------------------
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: ios-client/PhoneBridge
        run: xcodegen generate

      - name: Build iOS Application (Unsigned IPA)
        working-directory: ios-client/PhoneBridge
        run: |
          xcodebuild archive \
            -project PhoneBridge.xcodeproj \
            -scheme PhoneBridge \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/PhoneBridge.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

          # تزریق و ادغام مستقیم کلیدهای حریم خصوصی Info.plist در خروجی نهایی
          APP_DIR="build/PhoneBridge.xcarchive/Products/Applications/PhoneBridge.app"
          /usr/libexec/PlistBuddy -c "Merge Info.plist" "$APP_DIR/Info.plist"
          echo "=== VERIFYING FINAL INFO.PLIST ==="
          plutil -p "$APP_DIR/Info.plist"

          # بسته‌بندی فایل به فرمت استاندارد IPA برای Sideloadly
          mkdir -p build/Payload
          cp -r "$APP_DIR" build/Payload/
          cd build && zip -qr ../PhoneBridge.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneBridge-iOS-IPA
          path: ios-client/PhoneBridge/PhoneBridge.ipa
          retention-days: 7
