name: PhoneBridge
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "17.0"
packages:
  YbridOpus:
    url: https://github.com/ybrid/opus-swift.git
    version: 0.8.0
schemes:
  PhoneBridge:
    build:
      targets:
        PhoneBridge: all
    archive:
      config: Release
targets:
  PhoneBridge:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    dependencies:
      - package: YbridOpus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.phonebridge
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        SWIFT_VERSION: "5.0"
        ENABLE_BITCODE: "NO"
        GENERATE_INFOPLIST_FILE: "YES"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: "PhoneBridge"
        INFOPLIST_KEY_LSRequiresIPhoneOS: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "PhoneBridge requires Bluetooth to connect to your secondary Android phone to receive calls and SMS."
        INFOPLIST_KEY_NSBluetoothPeripheralUsageDescription: "PhoneBridge requires Bluetooth to connect to your secondary Android phone."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "PhoneBridge requires microphone access for call audio."
        INFOPLIST_KEY_UIBackgroundModes: "bluetooth-central audio"
